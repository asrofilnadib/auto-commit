name: Auto commit

on:
  schedule:
    # 08:00 WIB (Asia/Jakarta) = 01:00 UTC
    - cron: "0 1 * * *"

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: auto-commit-${{ github.ref }}
  cancel-in-progress: false

jobs:
  auto_commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Daily commits (5 unique emoji per day)
        run: bash scripts/daily-auto-commit.sh

      - name: GitHub Push
        run: |
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
